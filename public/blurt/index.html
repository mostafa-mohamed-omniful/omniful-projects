}

function renderSheet() {
  const stripX = sheetBody.querySelector('.strip')?.scrollLeft || 0, y = sheetBody.scrollTop;
  sheetBody.innerHTML = '';
  sheetAct.hidden = !['cal', 'rem', 'shop'].includes(current);
  sheetAct.textContent = current === 'shop' ? 'Share' : 'Export';
  if (current === 'cal') renderCal();
  else if (current === 'rem') renderRem();
  else if (current === 'top') renderTop();
  else renderList();
  const strip = sheetBody.querySelector('.strip');
  if (strip) strip.scrollLeft = stripX;
  sheetBody.scrollTop = y;
}

const emptyMsg = (text, parent = sheetBody) => parent.appendChild(el('p', 'empty', esc(text || CATS[current].empty)));

// To-dos, Shopping, Notes: a swipeable list. Shopping is grouped by aisle; old to-dos say how long they've waited.
function renderList() {
  const items = state.items[current], d = state.done[current];
  const stale = current === 'task' ? items.filter(it => ageDays(it) >= STALE).length : 0;
  sheetTitle.textContent = CATS[current].name;
  sheetSub.textContent = `${items.length} left` + (stale ? ` · ${stale} waiting a while` : '') + (d ? ` · ${d} done today` : '');
  swipeHint.innerHTML = 'Tap to edit · swipe right<br>to finish, left to remove';
  if (!items.length) return emptyMsg();

  if (current === 'shop') {
    const groups = new Map(AISLE_ORDER.map(a => [a, []]));
    items.forEach(it => groups.get(aisleOf(it.text)).push(it));
    const used = [...groups].filter(([, list]) => list.length);
    used.forEach(([name, list]) => {
      if (used.length > 1) sheetBody.appendChild(el('p', 'group', esc(name)));
      const ul = el('ul', 'list');
      list.forEach(it => ul.appendChild(makeRow(it, { chip: qtyLabel(it) })));
      sheetBody.appendChild(ul);
    });
    return;
  }
  const ul = el('ul', 'list');
  items.forEach(it => {
    const age = current === 'task' ? ageDays(it) : 0;
    ul.appendChild(makeRow(it, age >= STALE ? { chip: `${age} days`, chipClass: 'old' } : {}));
  });
  sheetBody.appendChild(ul);
}

// Today's 3: pick a few things to actually do today. Everything else can wait.
function renderTop() {
  state.top = state.top.filter(id => findItem(id));
  const pinned = state.top.map(findItem);
  sheetTitle.textContent = 'Today’s 3';
  sheetSub.textContent = pinned.length ? `${pinned.length} of 3 picked · the rest can wait` : 'Pick three. The rest can wait.';
  swipeHint.innerHTML = 'Swipe right when done<br>Swipe left to unpin';
  if (pinned.length) {
    const ul = el('ul', 'list');
    pinned.forEach(({ it, cat }) => ul.appendChild(makeRow(it, {
      rightLabel: 'Unpin', leftAction: 'unpin', chip: CATS[cat].name, chipStyle: `color: var(--${cat})`,
    })));
    sheetBody.appendChild(ul);
  }
  if (pinned.length >= 3) return;
  const sugg = suggestions().slice(0, 4);
  if (!sugg.length) {
    if (!pinned.length) emptyMsg('Nothing waiting on you. Enjoy it, or blurt out what’s on your mind.');
    return;
  }
  sheetBody.appendChild(el('p', 'group', pinned.length ? 'Add another?' : 'Suggested'));
  const wrap = el('div', 'list');
  sugg.forEach(({ it, cat, why }) => {
    const b = el('button', 'sugg', `<span class="sw" style="background: var(--${cat})"></span><span class="txt">${esc(it.text)}<small>${esc(why)}</small></span><span class="add">Add</span>`);
    b.type = 'button';
    b.addEventListener('click', () => { pin(it); buzz(8); renderSheet(); });
    wrap.appendChild(b);
  });
  sheetBody.appendChild(wrap);
}

// What's worth doing today: reminders due today, today's events, then the to-dos that have waited longest
function suggestions() {
  const now = Date.now(), end = addDays(startOfDay(now), 1), out = [];
  const add = (it, cat, why) => { if (!state.top.includes(it.id) && !out.some(o => o.it === it)) out.push({ it, cat, why }); };
  state.items.rem.filter(i => i.at != null && i.at < end).sort((a, b) => a.at - b.at)
    .forEach(i => add(i, 'rem', i.at <= now ? 'Overdue reminder' : `Reminder at ${timeLabel(i.at)}`));
  state.items.cal.filter(e => sameDay(e.at, now) && (e.allDay || e.at > now)).sort((a, b) => a.at - b.at)
    .forEach(e => add(e, 'cal', e.allDay ? 'Today' : `Today at ${timeLabel(e.at)}`));
  state.items.task.slice().sort((a, b) => (a.created || 0) - (b.created || 0))
    .forEach(t => add(t, 'task', ageDays(t) >= STALE ? `Waiting ${ageDays(t)} days` : 'To-do'));
  return out;
}

function pin(it) {
  if (state.top.includes(it.id)) return true;
  if (state.top.length >= 3) { toast('Today’s 3 is full. Unpin one first'); return false; }
  state.top.push(it.id);
  save();
  updateTopBtn();
  return true;
}
function updateTopBtn() {
  const n = state.top.filter(id => findItem(id)).length;
  topBtn.textContent = n ? `Today ${n}/3` : 'Today';
}

// Calendar: a scrollable strip of the next two weeks, then the chosen day as a timeline
const HOUR_H = 52;
function renderCal() {
  const now = Date.now();
  const evs = state.items.cal.filter(e => sameDay(e.at, calDay)).sort((a, b) => a.at - b.at);
  sheetTitle.textContent = dayLabel(calDay, true);
  const date = new Date(calDay).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  sheetSub.textContent = `${date} · ${evs.length ? `${evs.length} ${evs.length === 1 ? 'event' : 'events'}` : 'nothing planned'}`;
  swipeHint.textContent = 'Tap a day to see it';

  const strip = el('div', 'strip'), pill = el('span', 'pill');
  strip.appendChild(pill);
  for (let i = 0; i < 14; i++) {
    const t = addDays(startOfDay(now), i);
    const b = el('button', 'wd' + (t === calDay ? ' on' : ''), dayCell(t));
    b.type = 'button';
    b.setAttribute('aria-pressed', t === calDay);
    b.setAttribute('aria-label', new Date(t).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }));
    b.addEventListener('click', () => {
      if (t === calDay) return;
      calDir = Math.sign(t - calDay);
      calDay = t;
      renderSheet();
    });
    strip.appendChild(b);
  }
  sheetBody.appendChild(strip);

  // Everything below the strip lives in one block so it can slide in as a unit
  const day = el('div');
  sheetBody.appendChild(day);
  animateDaySwitch(strip, pill, day);

  if (!evs.length) {
    // Only suggest a phrase the sorter understands: today, tomorrow or a weekday this week
    const word = dayLabel(calDay, true), near = calDay - startOfDay(now) < 7 * DAY;
    const say = /^(Today|Tomorrow)$/.test(word) ? word.toLowerCase() : word;
    return emptyMsg(near ? `A free day. Say "gym ${say} at 6" and it lands here.` : 'A free day.', day);
  }
  const allDay = evs.filter(e => e.allDay), timed = evs.filter(e => !e.allDay);
  if (allDay.length) {
    const wrap = el('div', 'allday');
    allDay.forEach(e => wrap.appendChild(eventBlock(e, true)));
    day.appendChild(wrap);
  }
  if (!timed.length) return;

  const hrs = timed.map(e => new Date(e.at).getHours());
  const start = Math.min(8, ...hrs), end = Math.min(24, Math.max(21, Math.max(...hrs) + 2));
  const tl = el('div', 'timeline');
  for (let h = start; h < end; h++) tl.appendChild(el('div', 'hour', `<span>${timeLabel(new Date(calDay).setHours(h))}</span>`));
  timed.forEach(e => {
    const d = new Date(e.at);
    const b = eventBlock(e, false);
    b.style.top = ((d.getHours() - start) + d.getMinutes() / 60) * HOUR_H + 2 + 'px';
    tl.appendChild(b);
  });
  if (sameDay(now, calDay)) {
    const d = new Date(now), h = d.getHours() + d.getMinutes() / 60;
    if (h >= start && h < end) {
      const line = el('div', 'nowline');
      line.style.top = (h - start) * HOUR_H + 'px';
      tl.appendChild(line);
    }
  }
  day.appendChild(tl);
}

// Day switch: the pill glides to the new day, and the day's content slides in from that side.
// calDir is -1 (earlier day), 1 (later day) or 0 (sheet just opened: no motion).
let calDir = 0, pillX = null;
function animateDaySwitch(strip, pill, day) {
  const dir = calDir;
  calDir = 0;
  // Wait a frame so the strip has its final layout before measuring the selected day
  requestAnimationFrame(() => {
    const on = strip.querySelector('.wd.on');
    const moving = dir && pillX != null && !reduced;
    if (moving) pill.style.transform = `translateX(${pillX}px)`;
    pill.style.transition = 'none';
    pill.style.width = on.offsetWidth + 'px';
    pill.style.height = on.offsetHeight + 'px';
    pill.offsetWidth; // commit the starting position before turning the transition back on
    if (moving) pill.style.transition = '';
    pill.style.transform = `translateX(${on.offsetLeft}px)`;
    pillX = on.offsetLeft;
    if (dir) on.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });

    if (!moving) return;
    const dx = dir * 28, ease = 'cubic-bezier(.2,.8,.2,1)';
    [sheetTitle, sheetSub].forEach((n, i) =>
      n.animate([{ opacity: 0, transform: `translateX(${dx * 0.6}px)`, offset: 0 }], { duration: 260, delay: i * 30, easing: ease, fill: 'backwards' }));
    day.animate([{ opacity: 0, transform: `translateX(${dx}px)`, offset: 0 }], { duration: 300, easing: ease });
    day.querySelectorAll('.ev').forEach((n, i) =>
      n.animate([{ opacity: 0, scale: 0.96, offset: 0 }], { duration: 260, delay: 90 + i * 50, easing: 'ease-out', fill: 'backwards' }));
  });
}

function eventBlock(e, allDay) {
  const past = allDay ? startOfDay(e.at) < startOfDay(Date.now()) : e.at + HOUR < Date.now();
  const b = el('div', 'ev' + (past ? ' past' : ''),
    `<b>${esc(e.text)}</b><small>${allDay ? 'All day' : timeLabel(e.at)}</small><button type="button" class="x" aria-label="Remove ${esc(e.text)}">${X_SVG}</button>`);
  b.querySelector('.x').addEventListener('click', () => finish(e, b, 'remove'));
  b.tabIndex = 0;
  b.setAttribute('role', 'button');
  b.addEventListener('click', ev => { if (!ev.target.closest('.x')) editItem(e); });
  b.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target === b) editItem(e); });
  return b;
}

// Reminders: a hero card counting down to the next one, then the rest grouped by when
function renderRem() {
  const now = Date.now(), items = state.items.rem;
  const timed = items.filter(i => i.at != null).sort((a, b) => a.at - b.at);
  const next = timed[0];
  sheetTitle.textContent = 'Reminders';
  sheetSub.textContent = `${items.length} set` + (state.done.rem ? ` · ${state.done.rem} done today` : '');
  swipeHint.innerHTML = 'Swipe right when done<br>Swipe left to snooze';
  heroKey = next ? next.id + (next.at <= now) : '';
  if ('Notification' in window && Notification.permission === 'default') {
    const b = el('div', 'banner', '<span>Get a ping when a reminder goes off.</span><button type="button">Turn on</button>');
    b.querySelector('button').addEventListener('click', async () => { await askNotify(); renderSheet(); });
    sheetBody.appendChild(b);
  }
  if (!items.length) return emptyMsg();
  if (next) sheetBody.appendChild(makeHero(next, now));

  const rest = timed.slice(1);
  [
    ['Overdue', rest.filter(i => i.at <= now)],
    ['Later today', rest.filter(i => i.at > now && sameDay(i.at, now))],
    ['Coming up', rest.filter(i => i.at > now && !sameDay(i.at, now))],
    ['No time set', items.filter(i => i.at == null)],
  ].forEach(([name, group]) => {
    if (!group.length) return;
    sheetBody.appendChild(el('p', 'group', name));
    const ul = el('ul', 'list');
    group.forEach(it => {
      const over = it.at != null && it.at <= now;
      const chip = it.at == null ? '' : over ? 'Overdue' : sameDay(it.at, now) ? timeLabel(it.at) : whenLabel(it);
      ul.appendChild(makeRow(it, { rightLabel: 'Snooze 10 min', leftAction: 'snooze', chip, over }));
    });
    sheetBody.appendChild(ul);
  });
}

const left = (from, to) => Math.max(0, Math.min(100, ((to - Date.now()) / Math.max(1, to - from)) * 100));

function makeHero(it, now) {
  const over = it.at <= now, soon = it.at - now < DAY, from = it.created || now;
  const div = el('div', 'hero' + (over ? ' over' : ''),
    `<span class="lbl">${over ? 'Overdue' : 'Next reminder'}</span>
    <span class="big"${!over && soon ? ` data-until="${it.at}"` : ''}>${over ? timeLabel(it.at) : soon ? countdown(it.at) : esc(whenLabel(it))}</span>
    <button type="button" class="what" aria-label="Edit ${esc(it.text)}">${esc(it.text)}</button>
    ${over ? '' : `<span class="bar"><i data-from="${from}" data-to="${it.at}" style="width:${left(from, it.at)}%"></i></span>`}
    <div class="hero-actions"><button type="button" class="primary">Done</button><button type="button" class="secondary">Snooze 10 min</button></div>`);
  const [what, done, snooze] = div.querySelectorAll('button');
  what.addEventListener('click', () => editItem(it));
  done.addEventListener('click', () => { const r = rel(done); finish(it, null, 'done', r.x + r.w / 2, r.y + r.h / 2); });
  snooze.addEventListener('click', () => finish(it, null, 'snooze'));
  return div;
}

function makeRow(it, { rightLabel = 'Remove', leftAction = 'remove', chip = '', over = false, chipClass = '', chipStyle = '' } = {}) {
  const cls = ['when', over && 'over', chipClass].filter(Boolean).join(' ');
  const li = el('li', 'row',
    `<div class="row-bg" aria-hidden="true"><span class="l">Done</span><span class="r${leftAction !== 'remove' ? ' soft' : ''}">${rightLabel}</span></div>
    <div class="row-fg"><button class="tick" type="button" aria-label="Mark ${esc(it.text)} done"></button>
    <button class="txt" type="button" aria-label="Edit ${esc(it.text)}">${esc(it.text)}</button>${chip ? `<span class="${cls}"${chipStyle ? ` style="${chipStyle}"` : ''}>${esc(chip)}</span>` : ''}</div>`);
  const fg = li.querySelector('.row-fg'), tick = li.querySelector('.tick');
  tick.addEventListener('click', () => {
    const t = rel(tick);
    finish(it, li, 'done', t.x + t.w / 2, t.y + t.h / 2);
  });
  li.querySelector('.txt').addEventListener('click', () => { if (!fg.dataset.dragged) editItem(it); });
  bindSwipe(li, fg, (dir, x, y) => finish(it, li, dir === 'done' ? 'done' : leftAction, x, y));
  return li;
}

function bindSwipe(li, fg, onCommit) {
  let x0 = 0, y0 = 0, dx = 0, drag = false, id = null;
  fg.addEventListener('pointerdown', e => {
    if (e.target.closest('.tick')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; id = e.pointerId;
    fg.style.transition = 'none';
  });
  fg.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!drag) {
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { drag = true; fg.setPointerCapture(id); }
      else if (Math.abs(my) > 10) { id = null; return; }
      else return;
    }
    dx = mx;
    fg.style.transform = `translateX(${dx}px)`;
    li.dataset.dir = dx > 0 ? 'done' : 'remove';
    const armed = Math.abs(dx) > fg.offsetWidth * 0.33;
    if (armed !== li.classList.contains('armed')) { li.classList.toggle('armed', armed); if (armed) buzz(10); }
  });
  const end = e => {
    if (id !== e.pointerId) return;
    id = null;
    if (!drag) return;
    fg.dataset.dragged = '1'; // so the release doesn't also count as a tap
    setTimeout(() => delete fg.dataset.dragged, 60);
    fg.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
    if (Math.abs(dx) > fg.offsetWidth * 0.33) {
      const a = app.getBoundingClientRect();
      onCommit(dx > 0 ? 'done' : 'remove', e.clientX - a.left, e.clientY - a.top);
    } else {
      fg.style.transform = '';
      li.classList.remove('armed');
    }
  };
  fg.addEventListener('pointerup', end);
  fg.addEventListener('pointercancel', end);
}

// action: 'done' | 'remove' | 'snooze' | 'unpin'. node is the row or block to animate away (or null).
async function finish(it, node, action, x, y) {
  const cat = catOf(it);
  if (!cat) return;
  if (node) {
    if (node.dataset.gone) return;
    node.dataset.gone = '1';
    const fg = node.querySelector('.row-fg');
    if (fg) {
      node.dataset.dir = action === 'done' ? 'done' : 'remove';
      fg.style.transition = 'transform .25s cubic-bezier(.4,0,.2,1)';
      fg.style.transform = `translateX(${action === 'done' ? '' : '-'}110%)`;
      await sleep(230);
    }
    await node.animate([{ height: node.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }],
      { duration: reduced ? 0 : 220, easing: 'ease-in', fill: 'forwards' }).finished;
  }
  buzz(action === 'done' ? 14 : 8);

  const wasTop = state.top.includes(it.id);
  if (action === 'snooze') {
    it.at = Date.now() + 10 * MIN;
    it.created = Date.now();
    it.fired = false;
    toast('Snoozed for 10 min');
  } else if (action === 'unpin') {
    state.top = state.top.filter(id => id !== it.id);
  } else {
    state.items[cat] = state.items[cat].filter(o => o.id !== it.id);
    state.top = state.top.filter(id => id !== it.id);
    if (action === 'done') state.done[cat]++;
  }
  save();
  updateCard(cat);
  updateTopBtn();
  if (action === 'done' && current === cat && !state.items[cat].length) showTakeover(cat, x, y);
  else if (action === 'done' && current === 'top' && wasTop && !state.top.length) showTakeover('top', x, y);
  else renderSheet();
}

// ---------- The reward: full-screen takeover when a list is cleared ----------
function showTakeover(cat, x, y) {
  const d = cat === 'top' ? Object.values(state.done).reduce((a, b) => a + b, 0) : state.done[cat];
  takeover.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 52 L42 72 L82 28"/></svg>
    <h3>${nameOf(cat)},<br>${cat === 'top' ? 'done' : 'cleared'}.</h3>
    <p>${d} ${d === 1 ? 'thing' : 'things'} done today. Tap anywhere to go back.</p>`;
  takeover.style.opacity = 1;
  takeover.hidden = false;
  takeover.animate([{ clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(150% at ${x}px ${y}px)` }],
    { duration: reduced ? 0 : 650, easing: 'cubic-bezier(.6,0,.2,1)' });
  buzz([20, 60, 30]);
}

takeover.addEventListener('click', async () => {
  takeover.style.opacity = 0;
  await sleep(300);
  takeover.hidden = true;
  renderSheet();
  closeSheet();
});

$('back').addEventListener('click', closeSheet);
topBtn.addEventListener('click', () => openSheet('top'));
sheetAct.addEventListener('click', () => current === 'shop' ? shareList() : exportAll());
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!editor.hidden) closeEditor();
  else if (!takeover.hidden) takeover.click();
  else closeSheet();
});

// ---------- Editing an item: text, amount, list, time, today's 3 ----------
const editor = $('editor'), edForm = $('edForm'), edText = $('edText'), edQty = $('edQty'), edWhen = $('edWhen'), edAllDay = $('edAllDay'), edTop = $('edTop');
let edItem = null, edFrom = null, edCat = null;
const toInput = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function editItem(it) {
  edItem = it;
  edFrom = edCat = catOf(it);
  if (!edFrom) return;
  edText.value = it.text;
  edQty.value = qtyLabel(it);
  edWhen.value = it.at != null ? toInput(it.at) : '';
  edAllDay.checked = !!it.allDay;
  edTop.checked = state.top.includes(it.id);
  $('edCats').innerHTML = STACK_ORDER.slice().reverse().map(c =>
    `<button type="button" data-c="${c}" style="--c: var(--${c})">${CATS[c].name}</button>`).join('');
  syncEditor();
  editor.hidden = false;
  edForm.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: reduced ? 0 : 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
  editor.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduced ? 0 : 200 });
}

function syncEditor() {
  editor.style.setProperty('--catc', `var(--${edCat})`);
  $('edTitle').textContent = `Edit ${{ cal: 'event', rem: 'reminder', task: 'to-do', shop: 'item', note: 'note' }[edCat]}`;
  $('edCats').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === edCat));
  const timed = edCat === 'cal' || edCat === 'rem';
  $('edQtyRow').hidden = edCat !== 'shop';
  $('edWhenRow').hidden = !timed;
  $('edAllDayRow').hidden = edCat !== 'cal';
  $('edLinks').hidden = !timed || !edWhen.value;
  if (timed && edWhen.value) $('edGcal').href = gcalUrl(draft());
}

// The item as the form currently describes it
function draft() {
  const at = edWhen.value ? new Date(edWhen.value).getTime() : null;
  const out = { id: edItem.id, created: edItem.created || Date.now(), text: cap(edText.value.trim()) };
  if (edCat === 'cal') {
    out.allDay = at == null || edAllDay.checked;
    out.at = out.allDay ? startOfDay(at ?? Date.now()) : at;
  }
  if (edCat === 'rem') out.at = at;
  if (edCat === 'shop') Object.assign(out, parseQty(edQty.value));
  if (out.at === edItem.at && edItem.fired) out.fired = true; // same time: don't ping again
  return out;
}

function closeEditor() {
  if (editor.hidden) return;
  edForm.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: reduced ? 0 : 220, easing: 'ease-in' })
    .onfinish = () => { editor.hidden = true; };
}

$('edCats').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  edCat = b.dataset.c;
  if ((edCat === 'cal' || edCat === 'rem') && !edWhen.value) edWhen.value = toInput(Math.ceil(Date.now() / HOUR) * HOUR);
  syncEditor();
});
[edWhen, edAllDay, edText].forEach(n => n.addEventListener('input', syncEditor));
editor.addEventListener('click', e => { if (e.target === editor) closeEditor(); });

edForm.addEventListener('submit', e => {
  e.preventDefault();
  if (!edText.value.trim()) { edText.focus(); return; }
  const next = draft(), list = state.items[edFrom];
  if (edCat === edFrom) list[list.indexOf(edItem)] = next;
  else {
    state.items[edFrom] = list.filter(o => o !== edItem);
    state.items[edCat].unshift(next);
  }
  state.top = state.top.filter(id => id !== next.id || edTop.checked);
  if (edTop.checked && !state.top.includes(next.id)) pin(next);
  if (next.at != null && !next.fired) askNotify();
  save();
  updateAll();
  updateTopBtn();
  closeEditor();
  if (edCat !== edFrom) { toast(`Moved to ${CATS[edCat].name}`); bump(edCat); }
  if (!sheet.hidden) renderSheet();
});

$('edDelete').addEventListener('click', () => {
  state.items[edFrom] = state.items[edFrom].filter(o => o !== edItem);
  state.top = state.top.filter(id => id !== edItem.id);
  save();
  updateCard(edFrom);
  updateTopBtn();
  closeEditor();
  toast('Deleted');
  if (!sheet.hidden) renderSheet();
});
$('edIcs').addEventListener('click', () => {
  const it = draft();
  downloadFile(`${it.text.replace(/[^\w ]+/g, '').trim() || 'event'}.ics`, ics([{ it, cat: edCat }]), 'text/calendar');
});

// ---------- Calendar export: Google Calendar links and .ics files (Apple Calendar, Outlook, any calendar app) ----------
const utc = t => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; };

function gcalUrl(it) {
  const dates = it.allDay ? `${ymd(it.at)}/${ymd(addDays(it.at, 1))}` : `${utc(it.at)}/${utc(it.at + HOUR)}`;
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE', text: it.text, dates });
}

// Events get an alert 10 minutes before; reminders go off on the minute, so the phone's calendar can ping you
function ics(entries) {
  const txt = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Blurt//Blurt//EN', 'CALSCALE:GREGORIAN'];
  entries.forEach(({ it, cat }) => {
    lines.push('BEGIN:VEVENT', `UID:${it.id}@blurt`, `DTSTAMP:${utc(Date.now())}`, `SUMMARY:${txt(it.text)}`);
    if (it.allDay) lines.push(`DTSTART;VALUE=DATE:${ymd(it.at)}`, `DTEND;VALUE=DATE:${ymd(addDays(it.at, 1))}`);
    else lines.push(`DTSTART:${utc(it.at)}`, `DTEND:${utc(it.at + (cat === 'rem' ? 15 * MIN : HOUR))}`);
    if (!it.allDay) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${txt(it.text)}`, `TRIGGER:${cat === 'rem' ? 'PT0M' : '-PT10M'}`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

function exportAll() {
  const now = Date.now();
  const entries = [
    ...state.items.cal.filter(e => e.allDay ? startOfDay(e.at) >= startOfDay(now) : e.at >= now - HOUR).map(it => ({ it, cat: 'cal' })),
    ...state.items.rem.filter(r => r.at != null && r.at >= now).map(it => ({ it, cat: 'rem' })),
  ];
  if (!entries.length) return toast('Nothing coming up to export');
  downloadFile('blurt.ics', ics(entries), 'text/calendar');
  toast(`${entries.length} exported. Open the file to add them`);
}

function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = el('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Sharing the shopping list as text, aisle by aisle ----------
async function shareList() {
  const items = state.items.shop;
  if (!items.length) return toast('The list is empty');
  const groups = AISLE_ORDER.map(a => [a, items.filter(it => aisleOf(it.text) === a)]).filter(([, l]) => l.length);
  const text = 'Shopping list\n' + groups.map(([a, l]) => `\n${a}\n` + l.map(it => `• ${shopText(it)}`).join('\n')).join('\n');
  if (navigator.share) {
    try { await navigator.share({ title: 'Shopping list', text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('List copied. Paste it anywhere'); } catch { toast('Couldn’t share from here'); }
}

// ---------- Reminders that go off: notifications through the service worker ----------
let swReg = null;
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => handleAct(e.data || {}));
}
async function askNotify() {
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  try { await Notification.requestPermission(); } catch {}
}

// Checked every second: reminders that are due, and timed events starting in 10 minutes
function checkDue() {
  const now = Date.now();
  let changed = false;
  state.items.rem.forEach(it => {
    if (it.at == null || it.fired || it.at > now) return;
    it.fired = changed = true;
    if (now - it.at < 6 * HOUR) ping(it, 'rem'); // don't ping for things long past, like after a week away
  });
  state.items.cal.forEach(e => {
    if (e.allDay || e.fired || e.at - 10 * MIN > now) return;
    e.fired = changed = true;
    if (e.at > now - 5 * MIN) ping(e, 'cal');
  });
  if (changed) save();
}

function ping(it, cat) {
  const body = cat === 'rem' ? 'Reminder' : `Starts at ${timeLabel(it.at)}`;
  if (document.visibilityState === 'visible') { toast(`${cat === 'rem' ? 'Reminder' : 'Soon'}: ${it.text}`); buzz([40, 80, 40]); }
  if (!swReg || !('Notification' in window) || Notification.permission !== 'granted') return;
  swReg.showNotification(it.text, {
    body, tag: it.id, renotify: true, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [40, 80, 40], data: { id: it.id },
    actions: cat === 'rem' ? [{ action: 'done', title: 'Done' }, { action: 'snooze', title: 'Snooze 10 min' }] : [],
  }).catch(() => {});
}

// Buttons on a notification come back here (or through the URL, if the app had to be opened)
function handleAct({ act, id }) {
  const found = id && findItem(id);
  if (!found || !['done', 'snooze'].includes(act)) return;
  const { it, cat } = found;
  if (act === 'done') {
    state.items[cat] = state.items[cat].filter(o => o !== it);
    state.top = state.top.filter(i => i !== id);
    state.done[cat]++;
    toast(`Done: ${it.text}`);
  } else {
    it.at = Date.now() + 10 * MIN;
    it.created = Date.now();
    it.fired = false;
    toast('Snoozed for 10 min');
  }
  save();
  updateAll();
  updateTopBtn();
  if (!sheet.hidden) renderSheet();
}

// ---------- Live clock: countdowns tick every second ----------
setInterval(() => {
  document.querySelectorAll('[data-until]').forEach(n => { n.textContent = countdown(+n.dataset.until); });
  document.querySelectorAll('[data-to]').forEach(n => { n.style.width = left(+n.dataset.from, +n.dataset.to) + '%'; });
  checkDue();
  updateCard('rem');
  if (!sheet.hidden && current === 'rem' && takeover.hidden) {
    const n = nextRem(), key = n ? n.id + (n.at <= Date.now()) : '';
    if (key !== heroKey) renderSheet(); // the next reminder just went off, or changed
  }
}, 1000);

// ---------- Boot ----------
setHint();
updateAll();
updateTopBtn();
sizeOrb();
addEventListener('resize', sizeOrb);
requestAnimationFrame(drawOrb);

// Ways in from outside the app: the home-screen shortcut (?listen), the share sheet (?text), notification buttons (?act)
const params = new URLSearchParams(location.search);
if (location.search) history.replaceState(null, '', location.pathname);
if (params.get('code')) {
  try { localStorage.setItem(INVITE_KEY, params.get('code').trim().slice(0, 64)); } catch {}
}
// Ask the browser not to clear Blurt's data when the phone runs low on space
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (params.get('act')) handleAct({ act: params.get('act'), id: params.get('id') });
const shared = ['title', 'text', 'url'].map(k => params.get(k)).filter(Boolean).join(' ').trim();
if (shared) setTimeout(() => capture(shared.slice(0, 2000), { wordDelay: 40 }), 400);
else if (params.has('listen') && speechOk) setTimeout(listen, 300);
else if (params.get('view') === 'top') setTimeout(() => openSheet('top'), 100);
</script>
